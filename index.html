<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة طوابير السائقين | Riders Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-lg text-white">
                    <i class="fa-solid fa-motorcycle text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">نظام طوابير السائقين</h1>
                    <p class="text-xs text-gray-400">Riders Queue Management System</p>
                </div>
            </div>
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <span id="live-clock" class="text-sm bg-gray-700 px-3 py-1.5 rounded-md text-gray-300 font-mono"></span>
                <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-lg">
                    <i class="fa-solid fa-plus"></i> إضافة سائق للطابور
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400">إجمالي السائقين بالحطة</p>
                    <h3 id="stat-total" class="text-2xl font-bold mt-1 text-white">0</h3>
                </div>
                <div class="bg-blue-500/10 text-blue-400 p-3 rounded-lg"><i class="fa-solid fa-users text-xl"></i></div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400">في انتظار الطلب (في الطابور)</p>
                    <h3 id="stat-waiting" class="text-2xl font-bold mt-1 text-amber-400">0</h3>
                </div>
                <div class="bg-amber-500/10 text-amber-400 p-3 rounded-lg"><i class="fa-solid fa-clock text-xl"></i></div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400">في جولة توصيل حالياً</p>
                    <h3 id="stat-on-delivery" class="text-2xl font-bold mt-1 text-blue-400">0</h3>
                </div>
                <div class="bg-blue-500/10 text-blue-400 p-3 rounded-lg"><i class="fa-solid fa-route text-xl"></i></div>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-sm text-gray-400">تم إنهاء المهام اليومية</p>
                    <h3 id="stat-completed" class="text-2xl font-bold mt-1 text-emerald-400">0</h3>
                </div>
                <div class="bg-emerald-500/10 text-emerald-400 p-3 rounded-lg"><i class="fa-solid fa-check-circle text-xl"></i></div>
            </div>
        </div>

        <!-- Filters & Search -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/3 relative">
                <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="search-input" oninput="filterRiders()" placeholder="ابحث باسم السائق أو رقم الهاتف..." class="w-full bg-gray-900 border border-gray-700 rounded-lg pr-10 pl-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button onclick="setStatusFilter('ALL')" id="filter-all" class="filter-btn active-filter bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">الكل</button>
                <button onclick="setStatusFilter('WAITING')" id="filter-waiting" class="filter-btn bg-gray-700 text-gray-300 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">في الانتظار</button>
                <button onclick="setStatusFilter('ON_DELIVERY')" id="filter-on-delivery" class="filter-btn bg-gray-700 text-gray-300 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">في التوصيل</button>
                <button onclick="setStatusFilter('COMPLETED')" id="filter-completed" class="filter-btn bg-gray-700 text-gray-300 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap">مكتمل</button>
