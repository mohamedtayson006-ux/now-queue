<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طوابير السائقين الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة قراءة الباركود والـ QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-3 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold">نظام طوابير السائقين</h1>
                    <p class="text-xs text-slate-400">Riders Queue Management System</p>
                </div>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="startScanner()" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors text-sm font-medium">
                    <span>📷 فتح الكاميرا (سكان)</span>
                </button>
                <button onclick="openAddModal()" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center justify-center gap-2 transition-colors text-sm font-medium">
                    <span>+ إضافة يدوي</span>
                </button>
            </div>
        </div>

        <!-- Scanner Container (Hidden by default) -->
        <div id="scanner-container" class="hidden mb-6 bg-slate-800 p-4 rounded-xl border border-slate-700 max-w-md mx-auto text-center">
            <h3 class="text-sm font-bold mb-3 text-slate-300">قم بتوجيه الكاميرا نحو كود السائق</h3>
            <div id="reader" class="overflow-hidden rounded-lg"></div>
            <button onclick="stopScanner()" class="mt-3 px-4 py-1.5 bg-rose-600 hover:bg-rose-700 rounded-lg text-xs font-medium">إغلاق الكاميرا</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">إجمالي السائقين</p>
                <h3 id="total-count" class="text-2xl font-bold mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">في الانتظار (الطابور)</p>
                <h3 id="queue-count" class="text-2xl font-bold mt-1 text-amber-400">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">في جولة توصيل</p>
                <h3 id="delivering-count" class="text-2xl font-bold mt-1 text-blue-400">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">مكتمل</p>
                <h3 id="completed-count" class="text-2xl font-bold mt-1 text-emerald-400">0</h3>
            </div>
        </div>

        <!-- Search and Filters -->
        <div class="flex flex-col md:flex-row gap-4 mb-6 justify-between items-center">
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0">
                <button onclick="setFilter('all')" id="filter-all" class="px-4 py-2 bg-blue-600 rounded-lg text-sm font-medium whitespace-nowrap">الكل</button>
                <button onclick="setFilter('queue')" id="filter-queue" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium whitespace-nowrap">في الانتظار</button>
                <button onclick="setFilter('delivering')" id="filter-delivering" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium whitespace-nowrap">في التوصيل</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium whitespace-nowrap">مكتمل</button>
            </div>
            <div class="w-full md:w-80">
                <input type="text" id="search-input" oninput="renderRiders()" placeholder="ابحث باسم السائق أو كود الباركود..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- Content Area / Riders List -->
        <div id="riders-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- سيتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- Manual Add Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">إضافة سائق للطابور</h3>
            <form id="add-form" onsubmit="addRiderManual(event)">
                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1">اسم السائق</label>
                    <input type="text" id="rider-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="مثال: محمود محمد">
                </div>
                <div class="mb-4">
                    <label class="block text-xs text-slate-400 mb-1">كود الباركود / رقم التعريف</label>
                    <input type="text" id="rider-code" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500" placeholder="مثال: TAY-105">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">إلغاء</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm">إضافة للطابور</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // تحميل البيانات المحفوظة أو مصفوفة فارغة
        let riders = JSON.parse(localStorage.getItem('now_riders_queue')) || [];
        let currentFilter = 'all';
        let html5QrCode = null;

        function saveAndRender() {
            localStorage.setItem('now_riders_queue', JSON.stringify(riders));
            renderRiders();
        }

        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }
        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-form').reset();
        }

        function addRiderManual(e) {
            e.preventDefault();
            const name = document.getElementById('rider-name').value.trim();
            const code = document.getElementById('rider-code').value.trim();
            
            // تحقق إذا كان الكود موجود مسبقاً
            const existing = riders.find(r => r.code === code);
            if(existing) {
                alert('هذا الكود مسجل بالفعل في النظام!');
                return;
            }

            riders.unshift({
                id: Date.now(),
                name: name,
                code: code,
                status: 'queue', // queue, delivering, completed
                time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
            });

            closeAddModal();
            saveAndRender();
        }

        // تشغيل كاميرا السكان
        function startScanner() {
            document.getElementById('scanner-container').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    handleScannedCode(decodedText);
                    stopScanner();
                },
                (errorMessage) => {
                    // أخطاء المسح المؤقتة نتجاهلها لتجنب الإزعاج
                }
            ).catch(err => {
                alert("تعذر تشغيل الكاميرا. تأكد من إعطاء الصلاحية للمتصفح.");
            });
        }

        function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-container').classList.add('hidden');
                }).catch(err => console.log(err));
            } else {
                document.getElementById('scanner-container').classList.add('hidden');
            }
        }

        // التعامل مع الكود بعد قراءته بالكاميرا
        function handleScannedCode(code) {
            code = code.trim();
            let rider = riders.find(r => r.code === code);
            
            if (rider) {
                // لو السائق موجود في الانتظار، انقله للتوصيل، ولو في التوصيل انقله لمكتمل
                if(rider.status === 'queue') {
                    rider.status = 'delivering';
                } else if(rider.status === 'delivering') {
                    rider.status = 'completed';
                } else {
                    alert(`السائق ${rider.name} أكمل مهامه بالفعل.`);
                    return;
                }
            } else {
                // لو كود جديد تماماً، نقوم بإضافته للطابور فوراً
                let name = prompt(`كود جديد (${code}). أُدخل اسم السائق:`, "سائق جديد");
                if (!name) return;
                riders.unshift({
                    id: Date.now(),
                    name: name,
                    code: code,
                    status: 'queue',
                    time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'})
                });
            }
            saveAndRender();
        }

        function updateStatus(id, newStatus) {
            let rider = riders.find(r => r.id === id);
            if(rider) {
                rider.status = newStatus;
                saveAndRender();
            }
        }

        function deleteRider(id) {
            if(confirm('هل أنت متأكد من حذف هذا السائق؟')) {
                riders = riders.filter(r => r.id !== id);
                saveAndRender();
            }
        }

        function setFilter(status) {
            currentFilter = status;
            ['all', 'queue', 'delivering', 'completed'].forEach(s => {
                const btn = document.getElementById(`filter-${s}`);
                if(s === status) {
                    btn.className = "px-4 py-2 bg-blue-600 rounded-lg text-sm font-medium whitespace-nowrap";
                } else {
                    btn.className = "px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm font-medium whitespace-nowrap";
                }
            });
            renderRiders();
        }

        function renderRiders() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const listContainer = document.getElementById('riders-list');
            
            // تحديث الإحصائيات
            document.getElementById('total-count').innerText = riders.length;
            document.getElementById('queue-count').innerText = riders.filter(r => r.status === 'queue').length;
            document.getElementById('delivering-count').innerText = riders.filter(r => r.status === 'delivering').length;
            document.getElementById('completed-count').innerText = riders.filter(r => r.status === 'completed').length;

            let filtered = riders.filter(r => {
                const matchesFilter = currentFilter === 'all' || r.status === currentFilter;
                const matchesSearch = r.name.toLowerCase().includes(searchVal) || r.code.toLowerCase().includes(searchVal);
                return matchesFilter && matchesSearch;
            });

            if(filtered.length === 0) {
                listContainer.className = "bg-slate-800 rounded-xl border border-slate-700 p-8 text-center text-slate-400 col-span-full";
                listContainer.innerHTML = "لا توجد بيانات مطابقة حالياً.";
                return;
            }

            listContainer.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4";
            listContainer.innerHTML = filtered.map(r => {
                let statusBadge = '';
                let actionBtn = '';
                
                if(r.status === 'queue') {
                    statusBadge = '<span class="px-2.5 py-1 bg-amber-500/20 text-amber-400 rounded-full text-xs font-medium">في الانتظار</span>';
                    actionBtn = `<button onclick="updateStatus(${r.id}, 'delivering')" class="w-full mt-3 bg-blue-600 hover:bg-blue-700 py-1.5 rounded-lg text-xs font-medium transition-colors">بدء التوصيل ➔</button>`;
                } else if(r.status === 'delivering') {
                    statusBadge = '<span class="px-2.5 py-1 bg-blue-500/20 text-blue-400 rounded-full text-xs font-medium">في جولة توصيل</span>';
                    actionBtn = `<button onclick="updateStatus(${r.id}, 'completed')" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 py-1.5 rounded-lg text-xs font-medium transition-colors">إتمام الطلب ✓</button>`;
                } else {
                    statusBadge = '<span class="px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-full text-xs font-medium">مكتمل</span>';
                    actionBtn = `<button onclick="updateStatus(${r.id}, 'queue')" class="w-full mt-3 bg-slate-700 hover:bg-slate-600 py-1.5 rounded-lg text-xs font-medium transition-colors text-slate-300">إعادة للطابور ⟲</button>`;
                }

                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-base text-slate-100">${r.name}</h3>
                                ${statusBadge}
                            </div>
                            <p class="text-xs text-slate-400 mb-1">الكود: <span class="text-slate-200 font-mono">${r.code}</span></p>
                            <p class="text-[11px] text-slate-500">وقت الإضافة: ${r.time}</p>
                        </div>
                        <div>
                            ${actionBtn}
                            <div class="flex justify-end mt-2">
                                <button onclick="deleteRider(${r.id})" class="text-rose-400 hover:text-rose-300 text-xs">حذف</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // تشغيل العرض الأولي عند فتح الصفحة
        renderRiders();
    </script>
</body>
</html>
